[package]
name = "t5emu"
version = "0.1.0"
edition = "2024"
description = "ESP32-P4 rev v1.x emulator for tab5-os (doc/08 plan B, doc/11)"
license = "BSL-1.0"

[dependencies]
# Log decoding for the verdict and the console view (doc/12).
t5log = { path = "../tools/t5log", default-features = false }
t5-abi = { path = "../abi" }
# The PC end of the host link (--host-peer, doc/21); the version `net` uses.
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-icmp", "socket-raw", "auto-icmp-echo-reply", "proto-ipv6"] }

[profile.release]
debug = true
