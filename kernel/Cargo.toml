[package]
name = "t5-kernel"
version = "0.1.0"
edition = "2024"
description = "tab5-os M-mode kernel"
license = "MIT OR Apache-2.0"

[[bin]]
name = "t5-kernel"
test = false
bench = false

[features]
default = []
# Exactly one platform must be selected.
platform-virt = []
platform-esp32p4v1 = []
# L3 test: lock the core up after the self-test (doc/12 §7). Never ship.
test-lockup = []

[dependencies]
t5-abi = { path = "../abi" }
# Signature verification of app images (doc/14 §1.3).
ed25519-compact = { version = "2.6", default-features = false, features = ["opt_size"] }

[profile.release]
opt-level = "s"
debug = true
panic = "abort"
codegen-units = 1

# At opt-level "s" the field arithmetic inlines into ~600 KiB of code in
# double_scalarmult_vartime (measured); "z" keeps the verifier small.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
panic = "abort"
