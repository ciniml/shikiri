[package]
name = "t5-kernel"
version = "0.1.0"
edition = "2024"
description = "tab5-os M-mode kernel"
license = "MIT OR Apache-2.0"

[[bin]]
name = "t5-kernel"
test = false
bench = false

[features]
default = []
# Exactly one platform must be selected.
platform-virt = []
platform-esp32p4v1 = ["dep:kumiki-p4v1-hal", "dep:embedded-hal", "dep:kumiki-es8388", "dep:kumiki-es7210"]
# The board under platform-esp32p4v1 (doc/58 §3.1): the Tab5 unless this
# is set (the ESP32-P4-Function-EV-Board v1.5.x).
board-p4evb = []
# Chip v3.x (ESP32-P4 ECO5, the EV-Board v1.6.x; doc/58 R1b): another memory
# map (the L2 cache at the bottom of L2MEM) and ROM data address. Needs a
# bootloader built for v3 (boot/sdkconfig.v3).
chip-v3 = []
# L3 test: lock the core up after the self-test (doc/12 §7). Never ship.
test-lockup = []
# M5a rollback tests (doc/16 §3.6): a kernel that panics right after it
# starts, and one whose self-test always fails. Never ship.
test-bad-panic = []
test-bad-selftest = []

[dependencies]
t5-abi = { path = "../abi" }
# Signature verification of app images (doc/14 §1.3).
ed25519-compact = { version = "2.6", default-features = false, features = ["opt_size"] }
# I2S and the AHB-GDMA for audio (doc/70): kumiki's HAL without its runtime
# and console. ../m5-rs until it is published.
kumiki-p4v1-hal = { path = "../../m5-rs/hal/kumiki-p4v1-hal", default-features = false, optional = true }
# The Tab5's codecs, set up at boot (doc/70 §9): kumiki's drivers over the
# kernel's I2C.
embedded-hal = { version = "1.0", optional = true }
kumiki-es8388 = { path = "../../m5-rs/drivers/kumiki-es8388", optional = true }
kumiki-es7210 = { path = "../../m5-rs/drivers/kumiki-es7210", optional = true }

[profile.release]
opt-level = "s"
debug = true
panic = "abort"
codegen-units = 1

# At opt-level "s" the field arithmetic inlines into ~600 KiB of code in
# double_scalarmult_vartime (measured); "z" keeps the verifier small.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev]
panic = "abort"
