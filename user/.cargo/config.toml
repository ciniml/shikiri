[build]
target = "riscv32imafc-unknown-none-elf"

[unstable]
build-std = ["core"]

[target.riscv32imafc-unknown-none-elf]
rustflags = [
  "-C", "relocation-model=pie",
  "-C", "link-arg=-pie",
  "-C", "link-arg=--no-dynamic-linker",
  "-C", "link-arg=-z", "-C", "link-arg=text",
  "-C", "link-arg=-Tt5app.ld",
]
