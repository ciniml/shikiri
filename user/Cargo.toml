[workspace]
resolver = "3"
members = ["rt", "mtport", "apps/hello", "apps/fault", "apps/ticker", "apps/spin", "apps/timers", "apps/xipcheck", "apps/echo", "apps/paint", "apps/fs", "apps/fstest", "apps/net", "apps/nettest", "apps/wifi", "apps/netctl", "apps/init", "apps/keylog", "apps/term", "apps/shell", "apps/font", "apps/hcitest", "apps/ble", "apps/blescan", "apps/blegatt", "apps/bleecho", "apps/mtbench", "apps/matter", "apps/mtreq", "apps/mtep", "apps/mtpanel", "apps/mtdash", "apps/cfg", "apps/cfgctl", "apps/c6ota", "apps/ota", "kumiki-t5os", "apps/kgfx", "apps/imu", "apps/beep", "apps/mic", "apps/codecdiag", "apps/spkcheck", "tsclient", "apps/ts"]

[profile.release]
opt-level = "s"
debug = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"

# smoltcp with one fix (third_party/README.md, doc/34): SLAAC's poll_at
# stays in the past after the last router solicitation.
[patch.crates-io]
smoltcp = { path = "../third_party/smoltcp-0.14.0" }
# embedded-sdmmc that can make long file names (third_party/README.md,
# doc/63).
embedded-sdmmc = { path = "../third_party/embedded-sdmmc-0.10.0" }
# embedded-tls whose certificate chain starts where the trusted root
# signed (third_party/README.md, doc/71).
embedded-tls = { path = "../third_party/embedded-tls-0.19.0" }
