[workspace]
resolver = "3"
members = ["rt", "apps/hello", "apps/fault", "apps/ticker", "apps/spin", "apps/timers", "apps/xipcheck", "apps/echo", "apps/paint", "apps/fs", "apps/fstest", "apps/net", "apps/nettest", "apps/wifi", "apps/netctl", "apps/init"]

[profile.release]
opt-level = "s"
debug = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"

# smoltcp with one fix (third_party/README.md, doc/34): SLAAC's poll_at
# stays in the past after the last router solicitation.
[patch.crates-io]
smoltcp = { path = "../third_party/smoltcp-0.14.0" }
