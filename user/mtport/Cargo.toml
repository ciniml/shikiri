[package]
name = "mtport"
version = "0.1.0"
edition = "2024"
description = "simple-matter's platform adapters for tab5-os (doc/49): the RNG and the key-value store"
license = "MIT OR Apache-2.0"

[dependencies]
t5-rt = { path = "../rt" }
t5-abi = { path = "../../abi" }
simple-matter = { git = "https://github.com/ciniml/simple_matter.git", rev = "1544fae", default-features = false, features = ["rustcrypto"] }
